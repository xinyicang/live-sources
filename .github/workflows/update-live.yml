name: update-live

on:
  schedule:
    - cron: "17 */6 * * *"     # 每 6 小时（UTC），错开整点避免排队
  workflow_dispatch:           # 支持手动触发
  push:                        # 改了脚本或源清单就立刻跑一次
    paths:
      - "scripts/**"
      - "sources.txt"
      - ".github/workflows/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Build
        run: python scripts/build.py

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tv/ stats.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "chore: refresh live sources ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi
